# Demo overlay (Oracle Cloud Free, Ampere arm64 or x64): Postgres in a container and daily backups instead of the managed
# database. Use it on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml build
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d postgres
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml run --rm migrate
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml run --rm api --seed
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d
# In deploy/.env, PAN__ConnectionStrings__Default points to this container:
#   Host=postgres;Port=5432;Database=<POSTGRES_DB>;Username=<POSTGRES_USER>;Password=<POSTGRES_PASSWORD>

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-panissimo}
      POSTGRES_USER: ${POSTGRES_USER:-panissimo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Compressed pg_dump into deploy/backups (kept BACKUP_RETENTION_DAYS days), every BACKUP_INTERVAL_HOURS.
  backup:
    image: postgres:16
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-panissimo}
      PGUSER: ${POSTGRES_USER:-panissimo}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    entrypoint: ["/bin/sh", "-c", "while true; do /scripts/backup.sh || echo 'El respaldo falló' >&2; sleep $$((BACKUP_INTERVAL_HOURS * 3600)); done"]
    volumes:
      - ./backup:/scripts:ro
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api:
    environment:
      # Base catalogs of development and the demo (deploy/seed/sample-data.json); production does not load them.
      PAN__Seed__SampleDataFile: /seed/sample-data.json
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
