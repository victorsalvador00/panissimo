<app-plexus-background />

<button
  mat-icon-button
  class="theme-button"
  [matMenuTriggerFor]="themeMenu.menu()"
  aria-label="Tema"
>
  <mat-icon>contrast</mat-icon>
</button>
<app-theme-menu #themeMenu />

<main class="login">
  <section class="welcome">
    <mat-icon class="logo" aria-hidden="true">bakery_dining</mat-icon>
    <h1>Bienvenido</h1>
    <p>Sistema de Gestión Operativa · Paníssimo</p>
  </section>

  <form class="card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h2>Iniciar sesión</h2>

    @if (error(); as message) {
      <p class="alert" role="alert">{{ message }}</p>
    }

    <div class="field">
      <label for="login-email">Correo</label>
      <input
        id="login-email"
        type="email"
        formControlName="email"
        autocomplete="username"
        inputmode="email"
        [attr.aria-invalid]="controlError(form.controls.email) ? true : null"
        [attr.aria-describedby]="controlError(form.controls.email) ? 'login-email-error' : null"
      />
      @if (controlError(form.controls.email); as message) {
        <p id="login-email-error" class="field-error">{{ message }}</p>
      }
    </div>

    <div class="field">
      <label for="login-password">Contraseña</label>
      <input
        id="login-password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        [attr.aria-invalid]="controlError(form.controls.password) ? true : null"
        [attr.aria-describedby]="
          controlError(form.controls.password) ? 'login-password-error' : null
        "
      />
      @if (controlError(form.controls.password); as message) {
        <p id="login-password-error" class="field-error">{{ message }}</p>
      }
    </div>

    <button type="submit" class="submit" [disabled]="submitting()">
      {{ submitting() ? 'Entrando…' : 'Entrar' }}
    </button>
  </form>
</main>
