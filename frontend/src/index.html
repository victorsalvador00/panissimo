<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <title>SGO AR</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#005cbb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)" />
    <script>
      // Tema elegido (ThemeService) antes de pintar, para no mostrar un destello claro en modo oscuro.
      try {
        var theme = localStorage.getItem('sgo.theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="brand/apple-touch-icon.png" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>SGO AR necesita JavaScript habilitado.</noscript>
  </body>
</html>
